<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Mística G5 — Camisetas de fútbol calidad premium y colecciones retro. Pedí por WhatsApp." />
  <title>Mística G5 | Camisetas de Fútbol</title>
  <style>
    :root{
      --bg-color:#0f172a; --card-bg:#1e293b; --accent:#e11d48; --accent-hover:#be123c;
      --text:#f8fafc; --text-muted:#94a3b8;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
    body{background:var(--bg-color);color:var(--text);padding-bottom:96px}
    header{background:#020617;padding:1.5rem;text-align:center;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:10}
    header h1{font-size:1.8rem;letter-spacing:2px}
    header p{color:var(--text-muted);font-size:0.9rem;margin-top:4px}
    .filters{display:flex;justify-content:center;gap:10px;margin:20px 0;flex-wrap:wrap;padding:0 10px}
    .filter-btn{background:var(--card-bg);color:var(--text);border:1px solid #334155;padding:8px 16px;border-radius:20px;cursor:pointer;transition:all .2s}
    .filter-btn.active,.filter-btn:hover{background:var(--accent);border-color:var(--accent)}
    main{max-width:1100px;margin:0 auto;padding:0 15px}
    .container{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-bottom:100px}
    .card{background:var(--card-bg);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #334155}
    .card img{width:100%;height:220px;object-fit:cover;background:#000;display:block}
    .card-body{padding:15px;display:flex;flex-direction:column;flex-grow:1}
    .card-tag{font-size:.75rem;color:var(--accent);font-weight:bold;text-transform:uppercase}
    .card-title{font-size:1.1rem;margin:5px 0}
    .card-price{font-size:1.1rem;font-weight:bold;margin-top:auto;padding-top:10px}
    .btn-add{background:var(--accent);color:white;border:none;padding:10px;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:10px;transition:background .2s}
    .btn-add:hover{background:var(--accent-hover)}
    /* Cart bar */
    .cart-bar{position:fixed;bottom:0;left:0;right:0;background:#020617;border-top:1px solid #334155;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .cart-info{font-size:1rem;color:var(--text)}
    .btn-whatsapp{background:#22c55e;color:white;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
    .btn-whatsapp:hover{background:#16a34a}
    @media (max-width:520px){ .card img{height:160px} .filters{padding:0 8px} .cart-info{font-size:.95rem} }
  </style>
</head>
<body>
  <header>
    <h1>MÍSTICA G5</h1>
    <p>Calidad Premium &amp; Indumentaria Retro</p>
  </header>

  <div class="filters" role="navigation" aria-label="Filtrar productos">
    <button type="button" class="filter-btn active" onclick="filterProducts('todas', this)">Todas</button>
    <button type="button" class="filter-btn" onclick="filterProducts('g5', this)">Calidad G5</button>
    <button type="button" class="filter-btn" onclick="filterProducts('retro', this)">Colección Retro</button>
  </div>

  <main>
    <section class="container" id="product-list" aria-live="polite" aria-label="Listado de productos">
      <!-- Productos cargados dinámicamente -->
    </section>
  </main>

  <div class="cart-bar" role="region" aria-label="Carrito de compras">
    <div class="cart-info" id="cart-summary">
      🛒 <span id="cart-count" aria-live="polite">0</span> productos | <strong>Total: $<span id="cart-total">0</span></strong>
    </div>
    <button type="button" class="btn-whatsapp" id="whatsapp-btn" onclick="sendWhatsApp()" aria-label="Pedir por WhatsApp">Pedir por WhatsApp 📲</button>
  </div>

  <script>
    // Número: reemplazá con tu número completo (sin signos, con código de país), ej: 5493811234567
    const PHONE_NUMBER = "5493865251585";

    const products = [
      { id: 1, name: "Camiseta River Plate G5", category: "g5", price: 45000, img: "https://via.placeholder.com/600x600?text=River+G5" },
      { id: 2, name: "Camiseta Boca Juniors G5", category: "g5", price: 45000, img: "https://via.placeholder.com/600x600?text=Boca+G5" },
      { id: 3, name: "Camiseta Selección Argentina Retro '94", category: "retro", price: 45000, img: "https://via.placeholder.com/600x600?text=Argentina+94" },
      { id: 4, name: "Camiseta Milán Retro '98", category: "retro", price: 42000, img: "https://via.placeholder.com/600x600?text=Milan+98" }
    ];

    let cart = [];

    const formatter = new Intl.NumberFormat('es-AR');

    function renderProducts(filter = 'todas') {
      const container = document.getElementById('product-list');
      container.innerHTML = '';

      const filtered = filter === 'todas' ? products : products.filter(p => p.category === filter);

      filtered.forEach(p => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <img src="${p.img}" alt="${p.name}" loading="lazy" width="600" height="600">
          <div class="card-body">
            <span class="card-tag">${p.category}</span>
            <h3 class="card-title">${p.name}</h3>
            <div class="card-price">$${formatter.format(p.price)}</div>
            <button type="button" class="btn-add" onclick="addToCart(${p.id})" aria-label="Agregar ${p.name} al carrito">Agregar al Carrito</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // btnEl: el botón recibido desde el onclick (this) para marcar active
    function filterProducts(cat, btnEl) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderProducts(cat);
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      cart.push(product);
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart-count').innerText = cart.length;
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = formatter.format(total);
      // Opcional: cambiar estado del botón WhatsApp cuando carrito vacío
      document.getElementById('whatsapp-btn').disabled = cart.length === 0;
    }

    function sendWhatsApp() {
      if (cart.length === 0) {
        alert("Agregá al menos una camiseta al carrito antes de pedir.");
        return;
      }

      let message = "Hola! Quiero hacer el siguiente pedido:%0A%0A";
      cart.forEach((item, index) => {
        message += `${index + 1}. ${item.name} - $${formatter.format(item.price)}%0A`;
      });

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      message += `%0A*Total a pagar: $${formatter.format(total)}*`;

      // wa.me espera el número sin espacios ni signos
      const url = `https://wa.me/${PHONE_NUMBER}?text=${message}`;
      window.open(url, '_blank');
    }

    // Inicializar catálogo
    renderProducts();
  </script>
</body>
</html>
